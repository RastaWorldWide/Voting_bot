<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
<title>Голосование — Прософт Системы</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin:0; padding:0; height:100%; width:100%;
  font-family:"Inter","Segoe UI",Roboto,sans-serif;
  background: radial-gradient(circle at 70% 30%, #0a2942 0%, #02121f 80%);
  color:#fff; display:flex; justify-content:center; align-items:center;
  overflow:hidden; touch-action: manipulation;
  overscroll-behavior: none; /* предотвращает скролл на мобильных */
}
.background { position:absolute; inset:0; overflow:hidden; z-index:0; }
.lines { position:absolute; inset:0; width:100%; height:100%; opacity:0.25; z-index:0; }
@keyframes flow { 0% { stroke-dashoffset: 1000; } 100% { stroke-dashoffset: 0; } }
.lines path { stroke: #00c6ff; stroke-width:1.2; fill:none; stroke-dasharray:10 15; animation:flow 15s linear infinite; }
.vote-container { position: relative; z-index:2; width:90%; max-width:420px; background: rgba(0,10,20,0.7); border:1px solid rgba(0,140,255,0.3); border-radius:20px; padding:24px 28px; box-shadow:0 0 25px rgba(0,140,255,0.3); backdrop-filter: blur(6px); }
.vote-container h1 { margin-top:0; font-size:1.8rem; color:#00aaff; text-transform:uppercase; letter-spacing:1px; text-align:center; }
.vote-container p { font-size:0.95rem; margin-bottom:20px; color:#d0e6ff; }
label { display:block; text-align:left; margin-bottom:6px; font-weight:500; color:#9fd4ff; font-size:0.9rem; }
input, select { width:100%; padding:10px 12px; margin-bottom:14px; border-radius:8px; border:1px solid rgba(0,140,255,0.3); background-color: rgba(15,35,55,0.9); color:#fff; font-size:16px; outline:none; -webkit-appearance:none; appearance:none; }
input::placeholder { color:#8cbce6; }
select { background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' fill='%23ffffff' xmlns='http://www.w3.org/2000/svg'%3E<path d='M4 6l4 4 4-4H4z'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; background-size:12px; }
button { width:100%; background: linear-gradient(90deg, #007eff, #00c6ff); color:white; font-weight:600; border:none; border-radius:8px; padding:12px; font-size:1rem; cursor:pointer; transition: transform 0.1s ease, box-shadow 0.1s ease; }
button:hover { box-shadow:0 0 10px rgba(0,200,255,0.5); transform:translateY(-2px); }
@media (max-width:480px) { .vote-container { padding:18px 20px; border-radius:16px; } .vote-container h1 { font-size:1.4rem; } button { font-size:0.95rem; } }
.screen { display: none; flex-direction: column; align-items: center; justify-content: center; width:100%; }
.screen.active { display: flex; }
#validationMessage { color:#ff6b6b; font-size:0.9rem; display:none; margin-bottom:10px; }
#nomineeList { list-style:none; padding:0; margin:4px 0 14px 0; max-height:150px; overflow-y:auto; border:1px solid rgba(0,140,255,0.3); border-radius:6px; display:none; background:rgba(15,35,55,0.9); }
#nomineeList li { padding:6px; cursor:pointer; }
#nomineeList li:hover { background: rgba(0,140,255,0.3); }
</style>
</head>

<body>
<div class="background">
  <svg class="lines" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
    <path d="M0 100 Q200 150 400 100 T800 100" />
    <path d="M0 300 Q250 250 500 300 T800 300" />
    <path d="M0 500 Q200 550 400 500 T800 500" />
  </svg>
</div>

<div class="vote-container">
  <!-- Шаг 1 -->
  <div id="step1" class="screen active">
    <h1>Ваши данные</h1>
    <label for="fio">Ваше ФИО:</label>
    <input type="text" id="fio" placeholder="Иванов Иван Иванович" required />
    <label for="department">Ваш отдел:</label>
    <select id="department" required>
      <option value="" disabled selected>Загрузка отделов...</option>
    </select>
    <p id="validationMessage"></p>
    <button id="nextStep1" disabled>Далее</button>
  </div>

  <!-- Шаг 2 -->
  <div id="step2" class="screen">
    <h1>Кого номинируете?</h1>
    <label for="nomineeInput">Выберите сотрудника вашего отдела:</label>
    <input type="text" id="nomineeInput" placeholder="Начните вводить имя" disabled autocomplete="off" />
    <ul id="nomineeList"></ul>
    <button id="submitVote" disabled>Отправить голос</button>
  </div>

  <!-- Шаг 3 -->
  <div id="step3" class="screen">
    <h1>Спасибо!</h1>
    <p>Ваш голос учтён ✅</p>
  </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram.WebApp;
tg.expand();

// Шаги
const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const step3 = document.getElementById("step3");

// Inputs и кнопки
const fioInput = document.getElementById("fio");
const departmentSelect = document.getElementById("department");
const nextStep1 = document.getElementById("nextStep1");
const validationMessage = document.getElementById("validationMessage");

const nomineeInput = document.getElementById("nomineeInput");
const nomineeList = document.getElementById("nomineeList");
const submitVoteBtn = document.getElementById("submitVote");

let employees = [];
let validationTimeout;

// Загрузка отделов
async function loadDepartments() {
  try {
    const res = await fetch("https://www.prosoft-people.ru/api/departments");
    const data = await res.json();
    departmentSelect.innerHTML = '<option value="" disabled selected>Выберите отдел</option>';
    data.departments.forEach(dep => {
      const option = document.createElement("option");
      option.value = dep;
      option.textContent = dep;
      departmentSelect.appendChild(option);
    });
  } catch (err) {
    console.error("Ошибка загрузки отделов:", err);
    departmentSelect.innerHTML = '<option value="" disabled selected>Ошибка загрузки</option>';
  }
}
loadDepartments();

// Проверка ФИО и отдела
async function checkFioDept(fio, dept) {
  try {
    const res = await fetch("https://www.prosoft-people.ru/api/validate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fio, department: dept })
    });
    const data = await res.json();
    return data.valid;
  } catch (err) {
    console.error(err);
    return false;
  }
}

// Дебаунс проверки пользователя
async function validateUser() {
  const fio = fioInput.value.trim();
  const department = departmentSelect.value;
  nextStep1.disabled = true;
  validationMessage.style.display = "none";
  if (!fio || !department) return;
  clearTimeout(validationTimeout);
  validationTimeout = setTimeout(async () => {
    const valid = await checkFioDept(fio, department);
    nextStep1.disabled = !valid;
    validationMessage.style.display = valid ? "none" : "block";
    validationMessage.textContent = valid ? "" : "❌ Некорректное ФИО или отдел";
  }, 500);
}

fioInput.addEventListener("input", validateUser);
departmentSelect.addEventListener("change", validateUser);

// Переход на шаг 2
nextStep1.addEventListener("click", async () => {
  step1.classList.remove("active");
  step2.classList.add("active");

  const fio = fioInput.value.trim();
  const department = departmentSelect.value;

  nomineeInput.disabled = true;
  nomineeInput.value = "";
  nomineeList.innerHTML = "";
  nomineeList.style.display = "none";
  submitVoteBtn.disabled = true;

  try {
    const res = await fetch(`https://www.prosoft-people.ru/api/employees?department=${encodeURIComponent(department)}`);
    const data = await res.json();
    employees = data.employees.filter(emp => emp !== fio);
    nomineeInput.disabled = false;
    nomineeInput.focus({ preventScroll: true }); // предотвращает скролл/приближение
  } catch (err) {
    console.error(err);
    nomineeList.innerHTML = '<li>Ошибка загрузки сотрудников</li>';
    nomineeList.style.display = "block";
  }
});

// Автодополнение
nomineeInput.addEventListener("input", () => {
  const query = nomineeInput.value.toLowerCase();
  nomineeList.innerHTML = "";
  if (!query) { nomineeList.style.display = "none"; submitVoteBtn.disabled = true; return; }
  const matches = employees.filter(e => e.toLowerCase().includes(query));
  if (matches.length === 0) { nomineeList.style.display = "none"; submitVoteBtn.disabled = true; return; }
  matches.forEach(name => {
    const li = document.createElement("li");
    li.textContent = name;
    li.addEventListener("click", () => {
      nomineeInput.value = name;
      nomineeList.style.display = "none";
      submitVoteBtn.disabled = false;
    });
    nomineeList.appendChild(li);
  });
  nomineeList.style.display = "block";
});

// Отправка голоса
submitVoteBtn.addEventListener("click", async () => {
  const fio = fioInput.value.trim();
  const department = departmentSelect.value;
  const nominee = nomineeInput.value.trim();
  if (!nominee || !employees.includes(nominee)) { alert("❌ Выберите корректного сотрудника из списка"); return; }
  const valid = await checkFioDept(fio, department);
  if (!valid) { alert("❌ Некорректное ФИО или отдел. Проверьте и попробуйте снова."); return; }

  const voteData = { fio, department, nominee, chat_id: tg.initDataUnsafe?.user?.id || null };
  try {
    const response = await fetch("https://www.prosoft-people.ru/api/votes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(voteData)
    });
    if (response.ok) { step2.classList.remove("active"); step3.classList.add("active"); }
    else { const error = await response.json(); alert("Ошибка: " + (error.detail || "Не удалось отправить голос.")); }
  } catch (err) { console.error(err); alert("Не удалось отправить голос."); }
});
</script>

<img src="https://marketelectro.ru/sites/default/files/userfiles/11309/ps_logo_blue_2c_rus.png"
     alt="Prosoft Systems Logo"
     style="position:absolute; top:10px; left:10px; width:120px; height:auto; z-index:1;">
</body>
</html>
