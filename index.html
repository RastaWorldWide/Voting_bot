<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
<title>Голосование — Прософт Системы</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin:0; padding:0; height:100%; width:100%;
  font-family:"IBM Plex Sans","Inter","Segoe UI",Roboto,sans-serif;
  background: url('фон.jpg') no-repeat center center fixed;
  background-size: cover;
  color:#e0e7ff; display:flex; justify-content:center; align-items:center;
  overflow:hidden; touch-action: manipulation;
  overscroll-behavior: none;
}

.overlay-dark {
  position:absolute;
  inset:0;
  background: rgba(0, 10, 20, 0.55);
  backdrop-filter: blur(2px);
  z-index:0;
}

.vote-container {
  position: relative; z-index:2; width:90%; max-width:420px;
  background: rgba(0,10,20,0.60);
  border:1px solid rgba(77,181,255,0.35);
  border-radius:18px; padding:26px 30px;
  box-shadow:0 0 25px rgba(77,181,255,0.30);
  backdrop-filter: blur(10px);
  text-align:center;
}
.vote-container h1 {
  margin-top:0; font-size:1.8rem; color:#4db5ff;
  font-weight:600;
}
.vote-container p {
  font-size:0.95rem; margin-bottom:20px; color:#c0dfff;
}

label {
  display:block; text-align:left; margin-bottom:6px;
  font-weight:500; color:#b8d6ff; font-size:0.95rem;
}

input, select {
  width:100%; padding:12px 14px; margin-bottom:14px; border-radius:10px;
  border:1px solid rgba(77,181,255,0.35); background-color: rgba(8,29,51,0.85);
  color:#f0f7ff; font-size:15px; outline:none;
}
input::placeholder { color:#a0cfff; }
select {
  background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' fill='%23ffffff' xmlns='http://www.w3.org/2000/svg'%3E<path d='M4 6l4 4 4-4H4z'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center; background-size:12px;
}

button {
  width:100%; background-color:#4db5ff; color:white; font-weight:600;
  border:none; border-radius:10px; padding:13px; font-size:1rem;
  cursor:pointer; transition: all 0.2s ease;
}
button:hover {
  background-color:#3a94d1;
  box-shadow:0 2px 10px rgba(77,181,255,0.4);
  transform:translateY(-1px);
}

@media (max-width:480px) {
  .vote-container { padding:20px 20px; border-radius:16px; }
  .vote-container h1 { font-size:1.45rem; }
}

.screen { display: none; flex-direction: column; align-items: center; justify-content: center; width:100%; }
.screen.active { display: flex; }

#validationMessage { color:#ff6b6b; font-size:0.9rem; display:none; margin-bottom:10px; }

#nomineeList {
  list-style:none; padding:0; margin:4px 0 14px 0; max-height:150px; overflow-y:auto;
  border:1px solid rgba(77,181,255,0.3); border-radius:8px; display:none;
  background:rgba(8,29,51,0.85);
}
#nomineeList li { padding:8px; cursor:pointer; }
#nomineeList li:hover { background: rgba(77,181,255,0.3); }

.logo-top {
  position:absolute; top:18px; left:50%; transform:translateX(-50%);
  width:150px; z-index:3;
}

.logo-bottom {
  position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
  width:160px; opacity:0.9; z-index:3;
}
</style>
</head>

<body>
<img src="лого (1).png" class="logo-top" alt="Logo Top">
<div class="overlay-dark"></div>

<div class="vote-container">

  <!-- Шаг 1 -->
  <div id="step1" class="screen active">
    <h1>Введите ваши данные</h1>
    <label for="fio">ФИО:</label>
    <input type="text" id="fio" placeholder="Иванов Иван Иванович" required />

    <label for="department">Отдел:</label>
    <select id="department" required>
      <option value="" disabled selected>Загрузка отделов...</option>
    </select>

    <p id="validationMessage"></p>
    <button id="nextStep1" disabled>Далее</button>
  </div>

  <!-- Шаг 2 -->
  <div id="step2" class="screen">
    <h1>Выберите сотрудника</h1>
    <label for="nomineeInput">Сотрудник:</label>
    <input type="text" id="nomineeInput" placeholder="Введите ФИО сотрудника" disabled autocomplete="off" />
    <ul id="nomineeList"></ul>
    <button id="submitVote" disabled>Отправить голос</button>
  </div>

  <!-- Шаг 3 -->
  <div id="step3" class="screen">
    <h1>Спасибо!</h1>
    <p>Ваш голос успешно зарегистрирован.</p>
  </div>
</div>

<img src="лого (2).png" class="logo-bottom" alt="Logo Bottom">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram.WebApp;
tg.expand();

const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const step3 = document.getElementById("step3");

const fioInput = document.getElementById("fio");
const departmentSelect = document.getElementById("department");
const nextStep1 = document.getElementById("nextStep1");
const validationMessage = document.getElementById("validationMessage");

const nomineeInput = document.getElementById("nomineeInput");
const nomineeList = document.getElementById("nomineeList");
const submitVoteBtn = document.getElementById("submitVote");

let employees = [];
let validationTimeout;

async function loadDepartments() {
  try {
    const res = await fetch("https://www.prosoft-people.ru/api/departments");
    const data = await res.json();

    departmentSelect.innerHTML = '<option value="" disabled selected>Выберите отдел</option>';
    data.departments.forEach(dep => {
      const option = document.createElement("option");
      option.value = dep;
      option.textContent = dep;
      departmentSelect.appendChild(option);
    });
  } catch (err) {
    console.error(err);
    departmentSelect.innerHTML = '<option value="" disabled selected>Ошибка загрузки</option>';
  }
}
loadDepartments();

async function checkFioDept(fio, dept) {
  try {
    const res = await fetch("https://www.prosoft-people.ru/api/validate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fio, department: dept })
    });

    const data = await res.json();
    return data.valid;
  } catch (err) {
    console.error(err);
    return false;
  }
}

async function validateUser() {
  const fio = fioInput.value.trim();
  const department = departmentSelect.value;

  nextStep1.disabled = true;
  validationMessage.style.display = "none";
  if (!fio || !department) return;
  clearTimeout(validationTimeout);
  validationTimeout = setTimeout(async () => {
    const valid = await checkFioDept(fio, department);
    nextStep1.disabled = !valid;
    validationMessage.style.display = valid ? "none" : "block";
    validationMessage.textContent = valid ? "" : "❌ Некорректное ФИО или отдел";
  }, 400);
}

fioInput.addEventListener("input", validateUser);
departmentSelect.addEventListener("change", validateUser);

nextStep1.addEventListener("click", async () => {
  step1.classList.remove("active");
  step2.classList.add("active");

  const fio = fioInput.value.trim();
  const department = departmentSelect.value;

  nomineeInput.disabled = true;
  nomineeInput.value = "";
  nomineeList.innerHTML = "";
  nomineeList.style.display = "none";
  submitVoteBtn.disabled = true;

  try {
    const res = await fetch("https://www.prosoft-people.ru/api/employees");
    const data = await res.json();
    employees = data.employees.filter(emp => emp !== fio);
    nomineeInput.disabled = false;
    nomineeInput.focus({ preventScroll: true });
  } catch (err) {
    console.error(err);
    nomineeList.innerHTML = '<li>Ошибка загрузки сотрудников</li>';
    nomineeList.style.display = 'block';
  }
});

nomineeInput.addEventListener("input", () => {
  const query = nomineeInput.value.toLowerCase();
  nomineeList.innerHTML = "";
  if (!query) { nomineeList.style.display = "none"; submitVoteBtn.disabled = true; return; }
  const matches = employees.filter(e => e.toLowerCase().includes(query));
  if (matches.length === 0) { nomineeList.style.display = "none"; submitVoteBtn.disabled = true; return; }
  matches.forEach(name => {
    const li = document.createElement("li");
    li.textContent = name;
    li.addEventListener("click", () => {
      nomineeInput.value = name;
      nomineeList.style.display = "none";
      submitVoteBtn.disabled = false;
    });
    nomineeList.appendChild(li);
  });
  nomineeList.style.display = "block";
});

submitVoteBtn.addEventListener("click", async () => {
  const fio = fioInput.value.trim();
  const department = departmentSelect.value;
  const nominee = nomineeInput.value.trim();
  if (!nominee || !employees.includes(nominee)) { alert("❌ Выберите корректного сотрудника из списка"); return; }
  const valid = await checkFioDept(fio, department);
  if (!valid) { alert("❌ Некорректное ФИО или отдел. Проверьте и попробуйте снова."); return; }

  const voteData = { fio, department, nominee, chat_id: tg.initDataUnsafe?.user?.id || null };
  try {
    const response = await fetch("https://www.prosoft-people.ru/api/votes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(voteData)
    });
    if (response.ok) { step2.classList.remove("active"); step3.classList.add("active"); }
    else { const error = await response.json(); alert("Ошибка: " + (error.detail || "Не удалось отправить голос.")); }
  } catch (err) { console.error(err); alert("Не удалось отправить голос."); }
});
</script>

</body>
</html>
