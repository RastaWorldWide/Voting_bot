<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Голосование — Прософт Системы</title>
<style>
/* твой CSS оставляем без изменений */
</style>
</head>

<body>
<div class="vote-container">
  <!-- Шаг 1 -->
  <div id="step1" class="screen active">
    <h1>Введите ваши данные</h1>
    <label for="fio">ФИО:</label>
    <input type="text" id="fio" placeholder="Иванов Иван Иванович" required />
    <label for="department">Отдел:</label>
    <select id="department" required>
      <option value="" disabled selected>Загрузка отделов...</option>
    </select>
    <p id="validationMessage"></p>
    <button id="nextStep1" disabled>Далее</button>
  </div>

  <!-- Шаг 2 -->
  <div id="step2" class="screen">
    <h1>Выберите сотрудника для номинации</h1>
    <label for="nomineeInput">Сотрудник:</label>
    <input type="text" id="nomineeInput" placeholder="Введите ФИО сотрудника" disabled autocomplete="off" />
    <ul id="nomineeList"></ul>
    <button id="submitVote" disabled>Отправить голос</button>
  </div>

  <!-- Шаг 3 -->
  <div id="step3" class="screen">
    <h1>Спасибо за участие!</h1>
    <p>Ваш голос успешно зарегистрирован</p>
  </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram.WebApp;
tg.expand();

const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const step3 = document.getElementById("step3");

const fioInput = document.getElementById("fio");
const departmentSelect = document.getElementById("department");
const nextStep1 = document.getElementById("nextStep1");
const validationMessage = document.getElementById("validationMessage");

const nomineeInput = document.getElementById("nomineeInput");
const nomineeList = document.getElementById("nomineeList");
const submitVoteBtn = document.getElementById("submitVote");

let employees = [];
let validationTimeout;

// --- Загрузка отделов ---
async function loadDepartments() {
  try {
    const res = await fetch("https://www.prosoft-people.ru/api/departments");
    const data = await res.json();
    departmentSelect.innerHTML = '<option value="" disabled selected>Выберите отдел</option>';
    data.departments.forEach(dep => {
      const option = document.createElement("option");
      option.value = dep;
      option.textContent = dep;
      departmentSelect.appendChild(option);
    });
  } catch (err) {
    console.error("Ошибка загрузки отделов:", err);
    departmentSelect.innerHTML = '<option value="" disabled selected>Ошибка загрузки</option>';
  }
}
loadDepartments();

// --- Проверка ФИО и отдела ---
async function checkFioDept(fio, dept) {
  try {
    const res = await fetch("https://www.prosoft-people.ru/api/validate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fio, department: dept })
    });
    const data = await res.json();
    return data.valid;
  } catch (err) {
    console.error(err);
    return false;
  }
}

async function validateUser() {
  const fio = fioInput.value.trim();
  const department = departmentSelect.value;
  nextStep1.disabled = true;
  validationMessage.style.display = "none";
  if (!fio || !department) return;
  clearTimeout(validationTimeout);
  validationTimeout = setTimeout(async () => {
    const valid = await checkFioDept(fio, department);
    nextStep1.disabled = !valid;
    validationMessage.style.display = valid ? "none" : "block";
    validationMessage.textContent = valid ? "" : "❌ Некорректное ФИО или отдел";
  }, 500);
}

fioInput.addEventListener("input", validateUser);
departmentSelect.addEventListener("change", validateUser);

// --- Шаг 2: выбор номинанта ---
nextStep1.addEventListener("click", async () => {
  step1.classList.remove("active");
  step2.classList.add("active");

  const fio = fioInput.value.trim();
  const department = departmentSelect.value;

  nomineeInput.disabled = true;
  nomineeInput.value = "";
  nomineeList.innerHTML = "";
  nomineeList.style.display = "none";
  submitVoteBtn.disabled = true;

  try {
    const res = await fetch(`https://www.prosoft-people.ru/api/employees?department=${encodeURIComponent(department)}`);
    const data = await res.json();
    employees = data.employees.filter(emp => emp !== fio);
    nomineeInput.disabled = false;
    nomineeInput.focus({ preventScroll: true });
  } catch (err) {
    console.error(err);
    nomineeList.innerHTML = '<li>Ошибка загрузки сотрудников</li>';
    nomineeList.style.display = "block";
  }
});

// --- Поиск номинанта ---
nomineeInput.addEventListener("input", () => {
  const query = nomineeInput.value.toLowerCase();
  nomineeList.innerHTML = "";
  if (!query) { nomineeList.style.display = "none"; submitVoteBtn.disabled = true; return; }
  const matches = employees.filter(e => e.toLowerCase().includes(query));
  if (!matches.length) { nomineeList.style.display = "none"; submitVoteBtn.disabled = true; return; }
  matches.forEach(name => {
    const li = document.createElement("li");
    li.textContent = name;
    li.addEventListener("click", () => {
      nomineeInput.value = name;
      nomineeList.style.display = "none";
      submitVoteBtn.disabled = false;
    });
    nomineeList.appendChild(li);
  });
  nomineeList.style.display = "block";
});

// --- Отправка голоса ---
submitVoteBtn.addEventListener("click", async () => {
  const fio = fioInput.value.trim();
  const department = departmentSelect.value;
  const nominee = nomineeInput.value.trim();
  if (!nominee || !employees.includes(nominee)) { alert("❌ Выберите корректного сотрудника из списка"); return; }

  const valid = await checkFioDept(fio, department);
  if (!valid) { alert("❌ Некорректное ФИО или отдел"); return; }

  const voteData = { fio, department, nominee, chat_id: tg.initDataUnsafe?.user?.id || null };
  try {
    const res = await fetch("https://www.prosoft-people.ru/api/votes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(voteData)
    });
    if (res.ok) { step2.classList.remove("active"); step3.classList.add("active"); }
    else { const error = await res.json(); alert("Ошибка: " + (error.detail || "Не удалось отправить голос.")); }
  } catch (err) { console.error(err); alert("Не удалось отправить голос."); }
});
</script>
</body>
</html>
