<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>Голосование завершено — Прософт Системы</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "IBM Plex Sans", "Inter", "Segoe UI", Roboto, sans-serif;
      color: #e0e7ff;
      overflow: hidden;
      touch-action: manipulation;
      overscroll-behavior: none;
      height: 100%;
    }

    #viewport {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url('https://www.prosoft-people.ru/static/bg.jpg') no-repeat center center;
      background-size: cover;
    }

    .logo-top,
    .logo-bottom {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .logo-top { top: 24px; width: 160px; }
    .logo-bottom { bottom: 24px; width: 180px; opacity: 0.95; }

    .vote-container {
      position: relative;
      z-index: 2;
      width: 92%;
      max-width: 440px;
      background: rgba(8, 22, 40, 0.72);
      border: 1px solid rgba(65, 160, 240, 0.4);
      border-radius: 20px;
      padding: 36px 24px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(65, 160, 240, 0.2);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .screen h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #4db5ff;
      margin-bottom: 16px;
    }

    .screen p {
      font-size: 1.1rem;
      color: #c5dfff;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .event-info {
      font-size: 1.05rem;
      color: #ffffff;
      margin-top: 12px;
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .vote-container { padding: 30px 20px; }
      .screen h1 { font-size: 1.8rem; }
      .screen p { font-size: 1rem; }
      .event-info { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div id="viewport">
    <img src="https://www.prosoft-people.ru/static/logo_top.png" class="logo-top" alt="Прософт Системы">
    <div class="vote-container">
      <div class="screen">
        <h1>Спасибо за ваш голос!</h1>
        <p>Голосование завершено.</p>
        <p class="event-info">Увидимся 26 декабря — на юбилее в MTS Live Hall.</p>
      </div>
    </div>
    <img src="https://www.prosoft-people.ru/static/logo_bottom.png" class="logo-bottom" alt="Прософт Системы">
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.disableVerticalSwipes();
    }
  </script>
</body>
</html>
