<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>Голосование — Прософт Системы</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "IBM Plex Sans", "Inter", "Segoe UI", Roboto, sans-serif;
      color: #e0e7ff;
      overflow: hidden;
      touch-action: manipulation;
      overscroll-behavior: none;
      height: 100%;
    }

    #viewport {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url('https://www.prosoft-people.ru/static/bg.jpg') no-repeat center center;
      background-size: cover;
    }

    /* Логотипы — без z-index, чтобы оказались ПОД .vote-container */
    .logo-top,
    .logo-bottom {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none; /* клики проходят сквозь них */
    }

    .logo-top { top: 24px; width: 160px; }
    .logo-bottom { bottom: 24px; width: 180px; opacity: 0.95; }

    /* Панель голосования — теперь ПЕРЕКРЫВАЕТ логотипы */
    .vote-container {
      position: relative;
      z-index: 2;
      width: 92%;
      max-width: 440px;
      background: rgba(8, 22, 40, 0.72);
      border: 1px solid rgba(65, 160, 240, 0.4);
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(65, 160, 240, 0.2);
      backdrop-filter: blur(12px);
      text-align: center;
      transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .screen.active {
      display: flex;
    }

    .screen h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: #5cc4ff;
      margin-bottom: 18px;
    }

    .screen p {
      font-size: 0.95rem;
      color: #c5dfff;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    label {
      display: block;
      text-align: left;
      margin: 14px 0 6px;
      font-weight: 500;
      color: #b0d5ff;
      font-size: 0.95rem;
    }

    input, select {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid rgba(65, 160, 240, 0.45);
      background: rgba(5, 20, 38, 0.8);
      color: #f0f9ff;
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus, select:focus {
      border-color: #5cc4ff;
      box-shadow: 0 0 0 2px rgba(92, 196, 255, 0.2);
    }

    input::placeholder {
      color: #9fcfff;
    }

    select {
      background-image: url("image/svg+xml,%3Csvg width='14' height='14' fill='%23a5d3ff' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 6l4 4 4-4z'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 10px;
      -webkit-appearance: none;
      appearance: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: linear-gradient(135deg, #4db5ff, #2b97f0);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    button:hover:not(:disabled) {
      background: linear-gradient(135deg, #3a9fd1, #1a7ac5);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(77, 181, 255, 0.35);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #validationMessage {
      color: #ff7a7a;
      font-size: 0.9rem;
      margin-top: -8px;
      margin-bottom: 12px;
      min-height: 1.2em;
    }

    #nomineeList {
      list-style: none;
      padding: 0;
      margin: 8px 0 16px;
      max-height: 180px;
      overflow-y: auto;
      border-radius: 10px;
      background: rgba(5, 20, 38, 0.85);
      border: 1px solid rgba(65, 160, 240, 0.3);
      display: none;
    }

    #nomineeList li {
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.15s ease;
      text-align: left;
      font-size: 0.95rem;
    }

    #nomineeList li:hover {
      background: rgba(65, 160, 240, 0.2);
    }

    #nomineeList li + li {
      border-top: 1px solid rgba(65, 160, 240, 0.1);
    }

    @media (max-width: 480px) {
      .vote-container {
        padding: 24px 18px;
        border-radius: 18px;
      }
      .screen h1 {
        font-size: 1.5rem;
      }
      .logo-top, .logo-bottom {
        width: 140px;
      }
    }
  </style>
</head>
<body>
  <div id="viewport">
    <img src="https://www.prosoft-people.ru/static/logo_top.png" class="logo-top" alt="Прософт Системы">
    <div class="vote-container">
      <!-- Шаг 1 -->
      <div id="step1" class="screen active">
        <h1>Ваше участие</h1>
        <p>Пожалуйста, подтвердите вашу личность для голосования</p>

        <label for="fio">ФИО</label>
        <input type="text" id="fio" placeholder="Иванов Иван Иванович" autocomplete="off" required />

        <label for="department">Отдел</label>
        <select id="department" required>
          <option value="" disabled selected>Загрузка отделов…</option>
        </select>

        <div id="validationMessage"></div>
        <button id="nextStep1" disabled>Далее</button>
      </div>

      <!-- Шаг 2 -->
      <div id="step2" class="screen">
        <h1>Выберите кандидата</h1>
        <p>Голосуйте за коллегу, чья работа вдохновляет вас</p>

        <label for="nomineeInput">ФИО сотрудника</label>
        <input type="text" id="nomineeInput" placeholder="Начните вводить ФИО" autocomplete="off" disabled />
        <ul id="nomineeList"></ul>

        <button id="submitVote" disabled>Отправить голос</button>
      </div>

      <!-- Шаг 3 -->
      <div id="step3" class="screen">
        <h1>✅ Спасибо!</h1>
        <p>Ваш голос учтён.<br>Для выхода просто закройте окно.</p>
      </div>
    </div>
    <img src="https://www.prosoft-people.ru/static/logo_bottom.png" class="logo-bottom" alt="Прософт Системы">
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.disableVerticalSwipes();
    }

    // === Логика затемнения логотипов при фокусе ===
    const logoTop = document.querySelector('.logo-top');
    const logoBottom = document.querySelector('.logo-bottom');
    const fioInput = document.getElementById("fio");
    const nomineeInput = document.getElementById("nomineeInput");

    const dimLogos = () => {
      if (logoTop) logoTop.style.opacity = '0.3';
      if (logoBottom) logoBottom.style.opacity = '0.3';
    };
    const restoreLogos = () => {
      if (logoTop) logoTop.style.opacity = '1';
      if (logoBottom) logoBottom.style.opacity = '0.95';
    };

    fioInput?.addEventListener('focus', dimLogos);
    fioInput?.addEventListener('blur', restoreLogos);
    nomineeInput?.addEventListener('focus', dimLogos);
    nomineeInput?.addEventListener('blur', restoreLogos);

    // === Основная логика голосования ===
    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");
    const step3 = document.getElementById("step3");
    const departmentSelect = document.getElementById("department");
    const nextStep1 = document.getElementById("nextStep1");
    const validationMessage = document.getElementById("validationMessage");
    const nomineeList = document.getElementById("nomineeList");
    const submitVoteBtn = document.getElementById("submitVote");

    let employees = [];
    let validationTimeout = null;

    async function loadDepartments() {
      try {
        const res = await fetch("https://www.prosoft-people.ru/api/departments");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        departmentSelect.innerHTML = '<option value="" disabled selected>Выберите отдел</option>';
        data.departments?.forEach(dep => {
          const opt = document.createElement("option");
          opt.value = dep;
          opt.textContent = dep;
          departmentSelect.appendChild(opt);
        });
      } catch (err) {
        console.error("Ошибка при загрузке отделов:", err);
        departmentSelect.innerHTML = '<option value="" disabled selected>❌ Ошибка загрузки</option>';
      }
    }

    loadDepartments();

    async function checkFioDept(fio, dept) {
      try {
        const res = await fetch("https://www.prosoft-people.ru/api/validate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fio, department: dept })
        });
        const data = await res.json();
        return data.valid === true;
      } catch (err) {
        console.error("Ошибка валидации:", err);
        return false;
      }
    }

    function validateUser() {
      const fio = fioInput.value.trim();
      const dept = departmentSelect.value;

      nextStep1.disabled = true;
      validationMessage.textContent = "";
      validationMessage.style.display = "none";

      if (!fio || !dept) return;

      clearTimeout(validationTimeout);
      validationTimeout = setTimeout(async () => {
        const valid = await checkFioDept(fio, dept);
        nextStep1.disabled = !valid;
        if (!valid) {
          validationMessage.textContent = "❌ Не найдено в списке сотрудников";
          validationMessage.style.display = "block";
        }
      }, 450);
    }

    fioInput.addEventListener("input", validateUser);
    departmentSelect.addEventListener("change", validateUser);

    nextStep1.addEventListener("click", async () => {
      const fio = fioInput.value.trim();
      const dept = departmentSelect.value;

      try {
        const res = await fetch("https://www.prosoft-people.ru/api/employees");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        employees = (data.employees || []).filter(emp => emp && emp !== fio);

        step1.classList.remove("active");
        step2.classList.add("active");

        nomineeInput.disabled = false;
        nomineeInput.value = "";
        nomineeList.innerHTML = "";
        nomineeList.style.display = "none";
        submitVoteBtn.disabled = true;

        setTimeout(() => nomineeInput.focus({ preventScroll: true }), 100);
      } catch (err) {
        console.error("Не удалось загрузить список сотрудников:", err);
        alert("❌ Ошибка: не удалось получить список кандидатов");
      }
    });

    nomineeInput.addEventListener("input", () => {
      const query = nomineeInput.value.trim().toLowerCase();
      nomineeList.innerHTML = "";
      nomineeList.style.display = "none";
      submitVoteBtn.disabled = true;

      if (!query) return;

      const matches = employees.filter(emp =>
        emp && emp.toLowerCase().includes(query)
      ).slice(0, 15);

      if (matches.length === 0) return;

      nomineeList.style.display = "block";
      matches.forEach(name => {
        const li = document.createElement("li");
        li.textContent = name;
        li.addEventListener("click", () => {
          nomineeInput.value = name;
          nomineeList.style.display = "none";
          submitVoteBtn.disabled = false;
        });
        nomineeList.appendChild(li);
      });
    });

    submitVoteBtn.addEventListener("click", async () => {
      const fio = fioInput.value.trim();
      const dept = departmentSelect.value;
      const nominee = nomineeInput.value.trim();

      if (!nominee || !employees.includes(nominee)) {
        alert("❌ Выберите сотрудника из списка");
        return;
      }

      const stillValid = await checkFioDept(fio, dept);
      if (!stillValid) {
        alert("❌ Данные устарели. Пожалуйста, вернитесь и повторите ввод.");
        return;
      }

      const voteData = {
        fio,
        department: dept,
        nominee,
        chat_id: tg?.initDataUnsafe?.user?.id || null
      };

      try {
        const res = await fetch("https://www.prosoft-people.ru/api/votes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(voteData)
        });

        if (res.ok) {
          step2.classList.remove("active");
          step3.classList.add("active");
          if (tg && tg.close) {
            setTimeout(() => tg.close(), 2000);
          }
        } else {
          const err = await res.json().catch(() => ({}));
          alert("❌ " + (err.detail || "Не удалось отправить голос. Попробуйте позже."));
        }
      } catch (err) {
        console.error("Ошибка при отправке голоса:", err);
        alert("❌ Не удалось отправить голос. Проверьте соединение.");
      }
    });
  </script>
</body>
</html>
